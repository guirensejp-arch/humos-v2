<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Wireframe</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#263238; font-family:-apple-system,Segoe UI,Roboto,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login { background:#fff; border-radius:8px; width:100%; max-width:360px; }
  .login .brand { text-align:center; padding:18px; border-bottom:1px solid #eceff1; font-weight:700; color:#263238; font-size:20px; }
  .login .body { padding:20px; }
  .lbl { font-size:12px; color:#607d8b; display:block; margin-bottom:3px; }
  .val { font-size:11px; color:#e65100; }
  .btn-wf { width:100%; border:1px solid #b0bec5; background:#37474f; color:#fff; border-radius:6px; padding:10px; font-size:15px; }
</style>
</head>
<body>

<div class="login">
  <div class="brand">HUMOS v2</div>
  <div class="body">
    <div class="mb-3">
      <span class="lbl">Usuario</span>
      <input class="form-control" placeholder="usuario" autofocus>
    </div>
    <div class="mb-3">
      <span class="lbl">Contraseña</span>
      <input class="form-control" type="password" placeholder="••••••••">
    </div>
    <button class="btn-wf">Ingresar</button>
    <div class="val mt-3">▪ Autenticación con contraseña hasheada (nunca texto plano), vía Flask-Login. Roles: Admin y Cajero.<br>▪ Si el Admin reseteó tu contraseña, al ingresar con la temporal el sistema te fuerza a cambiarla.</div>
  </div>
</div>

</body>
</html>
